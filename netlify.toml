[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# Netlify Forms: every form on the site is detected at deploy time from the
# static HTML (form detection is on). Submissions land under Forms in the
# Netlify dashboard. Form names must stay unique across the whole site:
# contact, friction-scan, partner-debrief (index.html), constellr-debrief-v5
# (constellr-review.html), offsite-blueprint (offsite/index.html and
# offsite/configurator.html, hidden copies because app.js renders the real
# form), offsite-conversation (offsite-v2.html and new.html), offsite-partners-conversation
# (offsite-partners-v2.html), discovery-call (offsite/partners.html, no longer served) and
# sanctuary-application (next-offsites.html).
