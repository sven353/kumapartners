# Tells Bing (and the other IndexNow search engines) about every page in the sitemap.
# Runs after each upload to main, once the site has redeployed, and on demand from the Actions tab.
name: IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the Netlify deploy
        if: github.event_name == 'push'
        run: sleep 180

      - name: Submit sitemap URLs
        env:
          HOST: www.kuma.partners
          KEY: a386f2c214f354bfd434e113b9f03dfd
          SITEMAP: https://www.kuma.partners/sitemap.xml
        run: |
          set -e
          curl -fsSL "https://$HOST/$KEY.txt" | grep -qx "$KEY" || { echo "Key file not live yet at https://$HOST/$KEY.txt"; exit 1; }
          curl -fsSL "$SITEMAP" -o sitemap.xml
          if grep -q "<sitemapindex" sitemap.xml; then
            for u in $(grep -o '<loc>[^<]*' sitemap.xml | sed 's/<loc>//'); do curl -fsSL "$u"; done > all.xml
          else
            cp sitemap.xml all.xml
          fi
          URLS=$(grep -o '<loc>[^<]*' all.xml | sed 's/<loc>//' | python3 -c 'import sys, json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          echo "Submitting: $URLS"
          BODY=$(printf '{"host":"%s","key":"%s","keyLocation":"https://%s/%s.txt","urlList":%s}' "$HOST" "$KEY" "$HOST" "$KEY" "$URLS")
          CODE=$(curl -sS -o resp.txt -w "%{http_code}" -X POST "https://api.indexnow.org/indexnow" -H "Content-Type: application/json; charset=utf-8" -d "$BODY")
          echo "IndexNow answered HTTP $CODE"; cat resp.txt || true
          case "$CODE" in 200|202) ;; *) exit 1;; esac
